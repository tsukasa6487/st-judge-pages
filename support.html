<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ST Judge Support</title>
    <style>
      :root {
        color: #001b4d;
        background: #ffffff;
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic",
          "Noto Sans JP", sans-serif;
      }

      body {
        margin: 0;
      }

      main {
        box-sizing: border-box;
        margin: 0 auto;
        max-width: 760px;
        padding: 48px 20px;
      }

      h1 {
        font-size: 32px;
        margin: 0 0 8px;
      }

      h2 {
        border-top: 1px solid #d8dee8;
        font-size: 20px;
        margin: 32px 0 12px;
        padding-top: 24px;
      }

      p,
      li {
        color: #35435c;
        font-size: 16px;
        line-height: 1.8;
      }

      a {
        color: #0057e8;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>ST Judge Support</h1>
      <p>ソフトテニス審判補助アプリ ST Judge のサポートページです。</p>

      <h2>よくある使い方</h2>
      <ul>
        <li>試合設定でペア名、5ゲーム/7ゲーム、最初のサービスを選びます。</li>
        <li>試合画面で得点したペアのボタンを押して進行します。</li>
        <li>入力ミスは試合画面上部の「戻す」から取り消せます。</li>
        <li>終了した試合は結果画面に保存され、過去の試合結果から確認できます。</li>
      </ul>

      <h2>問い合わせ</h2>
      <p>
        不具合報告や改善要望は GitHub Issues で受け付けています。
        <a href="https://github.com/tsukasa6487/st-judge-pages/issues">
          ST Judge Issues
        </a>
      </p>

      <h2>プライバシー</h2>
      <p>
        プライバシーポリシーは
        <a href="./privacy.html">こちら</a>
        から確認できます。
      </p>
    </main>
  </body>
</html>
